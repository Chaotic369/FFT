<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAU/USD Tick Analysis System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* --- LEFT PANEL: THE GRID --- */
        .left-panel {
            width: 60%;
            height: 100%;
            display: flex;
            position: relative;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            grid-template-rows: repeat(117, 1fr); 
            flex: 1;
            height: 100%;
            background-color: #000000;
        }

        .grid-cell {
            box-sizing: border-box;
            border-right: 1px solid #222222;
            border-bottom: 1px solid #222222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(0.9vw, 1vh);
            user-select: none;
        }

        /* --- CENTER PANEL: DIVIDER & ROW NUMBERS --- */
        .center-panel {
            width: 5%;
            height: 100%;
            display: flex;
            border-left: 2px solid #444444;
            border-right: 2px solid #444444;
            background-color: #0a0a0a;
        }

        .multiplier-col, .index-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333333;
        }

        .center-cell {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(0.8vw, 0.9vh);
            border-bottom: 1px solid #222222;
            color: #aaaaaa;
        }
        
        .index-col .center-cell { 
            background-color: #000000; 
            color: #666666; 
        }

        /* --- RIGHT PANEL: DASHBOARD --- */
        .right-panel {
            width: 35%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 10px;
            gap: 15px;
        }

        /* Top Controls */
        .top-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #444444;
        }

        .control-btn {
            background: #111111;
            color: #ffffff;
            border: 1px solid #555555; 
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
        }

        .control-btn:hover { 
            background: #333333; 
        }
        
        .active-btn { 
            background: #ffffff; 
            color: #000000; 
        }

        .price-display {
            margin-left: auto;
            font-size: 16px;
            font-weight: normal;
        }

        /* Tables */
        .dashboard-table-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
            overflow-y: auto;
        }

        table.trading-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            border: 1px solid #333333;
        }

        table.trading-table th, table.trading-table td {
            border: 1px solid #333333;
            text-align: center;
            padding: 6px 4px;
        }

        table.trading-table th {
            background-color: #111111;
            color: #888888;
            font-weight: normal;
        }

        .table-title {
            text-align: left;
            font-size: 14px;
            padding-bottom: 5px;
            color: #ffffff;
            border-bottom: 1px solid #333333;
        }

        .asset-name { color: #cccccc; }
        .val-up { color: #44ff44; }
        .val-down { color: #ff4444; }

        /* Bottom Info */
        .bottom-info {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #444444;
            padding-top: 10px;
            font-size: 12px;
            color: #aaaaaa;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #444444; border-radius: 3px; }

    </style>
</head>
<body>

    <!-- LEFT PANEL: GRID -->
    <div class="left-panel">
        <div class="grid-container" id="matrix-grid"></div>
    </div>

    <!-- CENTER PANEL: ROW LABELS -->
    <div class="center-panel">
        <div class="multiplier-col" id="multiplier-col"></div>
        <div class="index-col" id="index-col"></div>
    </div>

    <!-- RIGHT PANEL: ANALYSIS DASHBOARD -->
    <div class="right-panel">
        
        <!-- Top Control Bar -->
        <div class="top-controls">
            <!-- Both Reversal and Momentum act as selected default logical tools per instruction -->
            <button class="control-btn active-btn">BS %</button>
            <button class="control-btn">ALL LVL</button>
            <button class="control-btn">SCAN</button>
            <button class="control-btn">AV</button>
            <div class="price-display">XAU/USD: <span id="current-price">0.00</span></div>
        </div>

        <div class="dashboard-table-container">
            <!-- REVERSAL TABLE -->
            <div class="table-title">Reversal Signals</div>
            <table class="trading-table" id="reversal-table">
                <thead>
                    <tr>
                        <th>Asset</th>
                        <th>C</th>
                        <th>R</th>
                        <th>Range</th>
                        <th>N1</th>
                        <th>N2</th>
                        <th>Status</th>
                        <th>Win%</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows injected by JS -->
                </tbody>
            </table>

            <!-- MOMENTUM TABLE -->
            <div class="table-title">Momentum Signals</div>
            <table class="trading-table" id="momentum-table">
                <thead>
                    <tr>
                        <th>Asset</th>
                        <th>C</th>
                        <th>R</th>
                        <th>Range</th>
                        <th>N1</th>
                        <th>N2</th>
                        <th>Status</th>
                        <th>Win%</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>

        <!-- Bottom Status -->
        <div class="bottom-info">
            <span id="sys-time">00:00</span>
            <span id="connection-status">Connecting...</span>
            <span>MIN: 61 | MAX: 120</span>
        </div>

    </div>

    <script>
        // --- 1. INITIALIZE LAYOUT (GRID & CENTER COLUMNS) ---
        const gridContainer = document.getElementById('matrix-grid');
        const multiplierCol = document.getElementById('multiplier-col');
        const indexCol = document.getElementById('index-col');
        
        const TOTAL_ROWS = 117;
        const TOTAL_COLS = 24;
        
        for (let i = 0; i < TOTAL_ROWS; i++) {
            const mCell = document.createElement('div');
            mCell.className = 'center-cell';
            mCell.textContent = 'x' + (Math.floor(Math.random() * 10) + 3);
            multiplierCol.appendChild(mCell);

            const idxCell = document.createElement('div');
            idxCell.className = 'center-cell';
            idxCell.textContent = i;
            indexCol.appendChild(idxCell);
        }

        const gridCells = [];
        for (let r = 0; r < TOTAL_ROWS; r++) {
            gridCells[r] = [];
            for (let c = 0; c < TOTAL_COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                gridContainer.appendChild(cell);
                gridCells[r].push(cell);
            }
        }

        // --- 2. XAU/USD TICK ENGINE & LOGIC ---
        let currentPrice = 2450.00; // Base rough value for Gold
        let activeRow = 0;
        let activeCol = 0;
        let currentStreak = 0;
        let lastColor = null;

        const priceDisplay = document.getElementById('current-price');
        const reversalTable = document.querySelector('#reversal-table tbody');
        const momentumTable = document.querySelector('#momentum-table tbody');
        const timeDisplay = document.getElementById('sys-time');
        const statusDisplay = document.getElementById('connection-status');

        setInterval(() => {
            const now = new Date();
            timeDisplay.textContent = now.toTimeString().split(' ')[0].substring(0, 5);
        }, 1000);

        function addSignalToTable(tableBody, streak, isUp) {
            const tr = document.createElement('tr');
            const colorClass = isUp ? 'val-up' : 'val-down';
            const cVal = Math.floor(Math.random() * 50) + 80;
            const rVal = Math.floor(Math.random() * 50) + 30;
            const winRate = Math.floor(Math.random() * 15) + 80;

            tr.innerHTML = `
                <td class="asset-name">XAU/USD</td>
                <td>C${cVal}</td>
                <td>R${rVal}</td>
                <td class="${colorClass}">X4-X${streak}</td>
                <td>22</td>
                <td>3</td>
                <td>Active</td>
                <td class="${colorClass}">${winRate}%</td>
            `;

            tableBody.insertBefore(tr, tableBody.firstChild);
            if (tableBody.children.length > 15) {
                tableBody.removeChild(tableBody.lastChild);
            }
        }

        function handleNewTick(price, isUp) {
            priceDisplay.textContent = price.toFixed(2);
            priceDisplay.style.color = isUp ? '#44ff44' : '#ff4444';

            const tickColor = isUp ? '#44ff44' : '#ff4444';

            if (lastColor === tickColor) {
                currentStreak++;
            } else {
                if (currentStreak >= 4) {
                    // Reverse color logic for reversal
                    addSignalToTable(reversalTable, currentStreak, !isUp);
                } else if (currentStreak === 3) {
                    addSignalToTable(momentumTable, currentStreak, !isUp);
                }
                currentStreak = 1;
                lastColor = tickColor;
            }

            if (activeRow < TOTAL_ROWS && activeCol < TOTAL_COLS) {
                const cell = gridCells[activeRow][activeCol];
                cell.textContent = 'x' + currentStreak;
                cell.style.color = tickColor;

                activeCol++;
                if (activeCol >= TOTAL_COLS) {
                    activeCol = 0;
                    activeRow++;
                }
            }
        }

        // --- 3. DERIV WEBSOCKET INTEGRATION ---
        function connectDerivWebSocket() {
            const appId = 1089; 
            const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${appId}`);
            let isFirstTick = true;

            ws.onopen = function() {
                statusDisplay.textContent = "Live: Deriv WS";
                statusDisplay.style.color = "#44ff44";
                ws.send(JSON.stringify({
                    ticks: "frxXAUUSD",
                    subscribe: 1
                }));
            };

            ws.onmessage = function(msg) {
                const data = JSON.parse(msg.data);
                
                if (data.error) {
                    console.error("Deriv API Error: ", data.error.message);
                    if (data.error.code === 'MarketIsClosed') {
                        statusDisplay.textContent = "Market Closed - Running Simulator";
                        statusDisplay.style.color = "#ffaa00";
                        startSimulationFallback();
                    } else {
                        statusDisplay.textContent = "Error: " + data.error.message;
                        statusDisplay.style.color = "#ff4444";
                    }
                    return;
                }

                if (data.tick) {
                    const newPrice = parseFloat(data.tick.quote);
                    
                    if (isFirstTick) {
                        currentPrice = newPrice;
                        isFirstTick = false;
                        return; 
                    }
                    
                    const isUp = newPrice >= currentPrice;
                    currentPrice = newPrice;
                    handleNewTick(currentPrice, isUp);
                }
            };

            ws.onclose = function() {
                statusDisplay.textContent = "Disconnected - Retrying...";
                statusDisplay.style.color = "#ff4444";
                setTimeout(connectDerivWebSocket, 5000);
            };

            ws.onerror = function(err) {
                console.error("WebSocket Error: ", err);
            };
        }

        // Fallback simulator specifically for when Forex markets are closed (Weekends)
        let simInterval;
        function startSimulationFallback() {
            if (simInterval) clearInterval(simInterval);
            simInterval = setInterval(() => {
                const change = (Math.random() - 0.5) * 0.6; 
                currentPrice += change;
                const isUp = change >= 0;
                handleNewTick(currentPrice, isUp);
            }, 1000);
        }

        // Initialize connection
        connectDerivWebSocket();

    </script>
</body>
</html>
